[project]
name = "fraudops"
version = "0.1.0"
description = "Insurance claims fraud triage: an end-to-end MLOps + local RAG copilot proof of concept"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "James Ma" }]
# Runtime dependencies are only what the scoring API needs, so the container stays small.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
]

[project.scripts]
fraudops = "fraudops.cli:main"

[dependency-groups]
# Training, tracking and reporting. Installed locally by default, left out of the image.
pipeline = [
    "mlflow>=2.16",
    "plotly>=5.24",
    "networkx>=3.3",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["pipeline", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraudops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*starlette.testclient.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
